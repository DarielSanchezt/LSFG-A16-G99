name: Build LSFG A16 G99 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install required Android build packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Find and extract enhanced LSFG source
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name 'LSFG-MODIFIED-0.1.2-A16-G99-ENHANCED.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: Enhanced LSFG ZIP was not found in the repository."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/source"

          GRADLEW="$(find "$GITHUB_WORKSPACE/source" -type f -path '*/lsfg-app/gradlew' | head -n 1)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: lsfg-app/gradlew was not found after extraction."
            exit 1
          fi

          APP_DIR="$(dirname "$GRADLEW")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Using Android project: $APP_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$APP_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Collect APKs
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find "$APP_DIR/app/build/outputs/apk" -type f -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;
          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LSFG-A16-G99-APK
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
